services:
  postgres:
    image: postgres:16-alpine
    container_name: brighted-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brighted_lms
    ports:
      - "5433:5432"
    volumes:
      - brighted_lms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brighted_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brighted_lms_postgres:
